<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Can’t reach this page</title>
  <style>
    /* Plain black-and-white, to match Space Drift's pixel art. */
    :root { --bg: #f7f7f7; --fg: #4d4d4d; --muted: #8a8a8a; --line: #c2c2c2; }
    @media (prefers-color-scheme: dark) { :root { --bg: #181818; --fg: #d9d9d9; --muted: #8f8f8f; --line: #5a5a5a; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.55 "Segoe UI", system-ui, sans-serif; }
    main { max-width: 560px; margin: 16vh auto 40px; padding: 0 24px; }
    .icon { width: 56px; height: 56px; color: var(--fg); }
    h1 { font-size: 24px; font-weight: 600; margin: 16px 0 10px; }
    p { margin: 0 0 12px; color: var(--muted); }
    b { color: var(--fg); font-weight: 600; word-break: break-all; }
    ul { margin: 0 0 12px; padding-left: 20px; color: var(--muted); }
    .code { font: 12px Consolas, monospace; color: var(--muted); margin-top: 14px; }
    .row { display: flex; gap: 10px; margin-top: 26px; flex-wrap: wrap; }
    button { font: 600 13px Consolas, "Courier New", monospace; text-transform: uppercase; letter-spacing: 0.04em; height: 36px; padding: 0 18px; border-radius: 0; cursor: pointer; }
    .primary { background: var(--fg); color: var(--bg); border: 2px solid var(--fg); }
    .ghost { background: none; border: 2px solid var(--fg); color: var(--fg); }
    .play-row { margin-top: 18px; align-items: center; }
    .play { display: inline-flex; align-items: center; gap: 8px; background: none; color: var(--fg); border: 2px dashed var(--fg); }
    .play:hover, .ghost:hover { background: var(--fg); color: var(--bg); }
    .play svg { width: 16px; height: 16px; }
    .row[hidden], .icon[hidden] { display: none; }
    #best { font: 12px Consolas, monospace; color: var(--muted); text-transform: uppercase; }
    /* Space Drift fills the whole tab while it's open. */
    #game { position: fixed; inset: 0; z-index: 10; background: var(--bg); }
    #game[hidden] { display: none; }
    #game canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: pointer; image-rendering: pixelated; }
    #game button { height: 28px; padding: 0 10px; font-size: 12px; background: var(--bg); color: var(--fg); border: 2px solid var(--fg); }
    #game button:hover { background: var(--fg); color: var(--bg); }
    #game-bar { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
    .modes { display: flex; }
    .modes button + button { border-left: 0; }
    #game .modes button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
    #game-hint { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); white-space: nowrap; padding: 2px 8px; background: var(--bg); font: 11px Consolas, monospace; text-transform: uppercase; color: var(--muted); pointer-events: none; }
    #signal { position: absolute; top: 52px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; padding: 6px 6px 6px 14px; background: var(--bg); color: var(--fg); border: 2px solid var(--fg); font: 600 13px Consolas, monospace; text-transform: uppercase; }
    #signal[hidden] { display: none; }
    #game #signal button { background: var(--fg); color: var(--bg); }
  </style>
</head>
<body>
  <main>
    <svg class="icon" id="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M2.5 8.5a14 14 0 0 1 19 0M5.5 12a9.5 9.5 0 0 1 13 0M8.6 15.4a5 5 0 0 1 6.8 0"/><circle cx="12" cy="19" r="1"/><path d="M3 3l18 18"/>
    </svg>
    <h1 id="title">Can’t reach this page</h1>
    <p id="msg"></p>
    <ul id="tips"></ul>
    <div class="code" id="code"></div>
    <div class="row">
      <button class="primary" id="retry" autofocus>Try again</button>
      <button class="ghost" id="back">Go back</button>
    </div>
    <div class="row play-row">
      <button class="play" id="play">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="4"/><path d="M7 10v4M5 12h4"/><circle cx="16" cy="11" r="1"/><circle cx="18" cy="13" r="1"/></svg>
        <span id="play-label">Play offline</span>
      </button>
      <span id="best"></span>
    </div>
  </main>
  <div id="game" hidden>
    <canvas id="game-canvas" aria-label="Space Drift game"></canvas>
    <div id="game-bar">
      <div class="modes" role="group" aria-label="Game mode">
        <button id="mode-classic" aria-pressed="true">Classic</button>
        <button id="mode-zen" aria-pressed="false">Zen</button>
      </div>
      <button class="game-btn" id="game-close">Close game (Esc)</button>
    </div>
    <div id="signal" role="status" hidden>Signal found. <button id="signal-go">Return to page</button></div>
    <div id="game-hint">Space / click / touch to fly · P to pause · Z to switch Classic / Zen · Esc to close</div>
  </div>
  <script src="offline-game.js"></script>
  <script src="offline.js"></script>
</body>
</html>

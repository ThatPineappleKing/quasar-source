<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Sign in</title>
  <style>
    :root { --bg: #ffffff; --fg: #1d1730; --muted: #6b6480; --line: #e3deee; --field: #f5f2fb; --accent: #6b4fd8; --warn: #b3261e; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #24212d; --fg: #f1eef8; --muted: #a8a1b8; --line: #3a3546; --field: #2f2b3a; --accent: #9b86ff; --warn: #ff8a80; }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: transparent; }
    body { font: 13px/1.4 "Segoe UI", system-ui, sans-serif; color: var(--fg); padding: 8px; }
    .box { height: 100%; background: var(--bg); border-radius: 10px; padding: 20px 22px 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .22), 0 0 0 1px rgba(0, 0, 0, .08); display: flex; flex-direction: column;
      -webkit-app-region: drag; }
    h1 { font-size: 16px; font-weight: 600; margin: 0 0 6px; }
    .sub { color: var(--muted); margin: 0 0 4px; word-break: break-word; }
    .warn { color: var(--warn); margin: 4px 0 0; font-size: 12px; }
    form { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; -webkit-app-region: no-drag; flex: 1; }
    label { font-size: 12px; font-weight: 600; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
    input { font: inherit; color: var(--fg); background: var(--field); border: 1px solid var(--line); border-radius: 8px; height: 32px; padding: 0 10px; outline: none; }
    input:focus { border-color: var(--accent); }
    .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: auto; }
    button { font: inherit; font-weight: 600; height: 32px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: default; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <div class="box" role="dialog" aria-labelledby="title">
    <h1 id="title">Sign in</h1>
    <p class="sub" id="sub"></p>
    <p class="sub" id="realm" hidden></p>
    <p class="warn" id="warn" hidden>Your connection to this site isn’t private, so this password could be seen by others.</p>
    <form id="form" autocomplete="off">
      <label>Username<input id="user" autocomplete="username" spellcheck="false"></label>
      <label>Password<input id="pass" type="password" autocomplete="current-password"></label>
      <div class="btns">
        <button type="button" id="cancel">Cancel</button>
        <button type="submit" class="primary">Sign in</button>
      </div>
    </form>
  </div>
  <script src="auth.js"></script>
</body>
</html>

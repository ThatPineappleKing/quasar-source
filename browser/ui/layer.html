<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Quasar layer</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font: 13px/1.3 "Segoe UI", system-ui, sans-serif; user-select: none; }
    [hidden] { display: none !important; }
    /* ---- Peek: dimmed page behind, toolbar above the preview */
    #peek { position: fixed; inset: 0; background: rgba(15, 12, 25, .38); border-radius: 10px; animation: fade .14s ease-out; }
    #peekBar { position: absolute; top: 8px; height: 32px; display: flex; align-items: center; gap: 4px; padding: 0 4px 0 12px;
      background: rgba(255,255,255,.94); color: #1d1730; border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
    #peekTitle { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
    #peekHost { color: #6b6480; font-weight: 400; margin-left: 8px; }
    .pb { height: 26px; padding: 0 10px; border: 0; border-radius: 7px; background: transparent; color: inherit; font: inherit; cursor: pointer; white-space: nowrap; }
    .pb:hover { background: rgba(0,0,0,.07); }
    .pb.primary { background: #1d1730; color: #fff; }
    .spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #c9c2dc; border-top-color: #6b4fd8; animation: spin .7s linear infinite; flex: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fade { from { opacity: 0; } }
    /* ---- Screenshot picker */
    #shot { position: fixed; inset: 0; cursor: crosshair; background: rgba(0,0,0,.18); border-radius: 10px; }
    #sel { position: absolute; border: 2px solid #fff; box-shadow: 0 0 0 9999px rgba(0,0,0,.35); border-radius: 3px; pointer-events: none; }
    #selSize { position: absolute; left: 0; top: -24px; background: #1d1730; color: #fff; font-size: 11px; padding: 2px 6px; border-radius: 5px; white-space: nowrap; }
    #shotHint { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: rgba(29,23,48,.88); color: #fff; padding: 7px 12px; border-radius: 9px; font-size: 12.5px; white-space: nowrap; pointer-events: none; }
    #shotBar { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; padding: 6px; background: rgba(255,255,255,.95); border-radius: 12px; box-shadow: 0 8px 28px rgba(0,0,0,.3); cursor: default; }
    #shotBar .pb { color: #1d1730; }
    kbd { font: 10.5px "Segoe UI", sans-serif; opacity: .6; margin-left: 4px; }
  </style>
</head>
<body>
  <div id="peek" hidden>
    <div id="peekBar">
      <span id="peekSpin" class="spin" hidden></span>
      <span id="peekTitle"><span id="peekName"></span><span id="peekHost"></span></span>
      <button class="pb" id="pCopy" title="Copy link">Copy link</button>
      <button class="pb" id="pLittle" title="Open in a Little Quasar window">Little Quasar</button>
      <button class="pb primary" id="pExpand" title="Open as a tab">Open as tab</button>
      <button class="pb" id="pClose" title="Close (Esc)">✕</button>
    </div>
    </div>
  <div id="shot" hidden>
    <div id="shotHint">Drag to capture an area · <b>Enter</b> visible area · <b>F</b> full page · <b>Esc</b> cancel</div>
    <div id="sel" hidden><span id="selSize"></span></div>
    <div id="shotBar">
      <button class="pb" id="sVisible">Visible area<kbd>Enter</kbd></button>
      <button class="pb" id="sFull">Full page<kbd>F</kbd></button>
      <button class="pb" id="sCancel">Cancel<kbd>Esc</kbd></button>
    </div>
  </div>
  <script src="layer.js"></script>
</body>
</html>

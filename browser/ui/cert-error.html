<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Privacy error</title>
  <style>
    :root { --bg: #ffffff; --fg: #202124; --muted: #5f6368; --red: #c5221f; --accent: #6b4fd8; --line: #dadce0; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #202124; --fg: #e8eaed; --muted: #9aa0a6; --red: #f28b82; --accent: #a28fff; --line: #3c4043; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.55 "Segoe UI", system-ui, sans-serif; }
    main { max-width: 600px; margin: 14vh auto 40px; padding: 0 24px; }
    .icon { width: 56px; height: 56px; color: var(--red); }
    h1 { font-size: 26px; font-weight: 600; margin: 18px 0 14px; }
    p { margin: 0 0 12px; color: var(--muted); }
    b { color: var(--fg); font-weight: 600; word-break: break-all; }
    .code { font: 12px Consolas, monospace; color: var(--muted); letter-spacing: .02em; margin-top: 16px; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 32px; flex-wrap: wrap; }
    button { font: inherit; font-size: 14px; font-weight: 600; height: 38px; padding: 0 20px; border-radius: 8px; cursor: pointer; }
    .primary { background: var(--accent); color: #fff; border: 0; }
    .link { background: none; border: 1px solid var(--line); color: var(--fg); }
    #more { margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line); }
    #proceed { background: none; border: 0; padding: 0; height: auto; color: var(--red); text-decoration: underline; font-weight: 400; }
  </style>
</head>
<body>
  <main>
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h.01"/>
    </svg>
    <h1>Your connection isn’t private</h1>
    <p>Attackers might be trying to steal your information from <b id="host"></b> (for example, passwords, messages, or credit cards).</p>
    <div class="code" id="code"></div>
    <div class="row">
      <button class="link" id="advanced" aria-expanded="false">Advanced</button>
      <button class="primary" id="back" autofocus>Back to safety</button>
    </div>
    <section id="more" hidden>
      <p id="why"></p>
      <p id="proceedRow"><button id="proceed"></button></p>
      <p id="noProceed" hidden>You can’t continue to this site because Quasar didn’t get a chance to check its certificate.</p>
    </section>
  </main>
  <script src="cert-error.js"></script>
</body>
</html>

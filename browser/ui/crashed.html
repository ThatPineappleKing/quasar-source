<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Page crashed</title>
  <style>
    :root { --bg: #ffffff; --fg: #202124; --muted: #5f6368; --accent: #6b4fd8; --line: #dadce0; }
    @media (prefers-color-scheme: dark) { :root { --bg: #202124; --fg: #e8eaed; --muted: #9aa0a6; --accent: #a28fff; --line: #3c4043; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.55 "Segoe UI", system-ui, sans-serif; }
    main { max-width: 560px; margin: 16vh auto 40px; padding: 0 24px; }
    .icon { width: 56px; height: 56px; color: var(--muted); }
    h1 { font-size: 24px; font-weight: 600; margin: 16px 0 10px; }
    p { margin: 0 0 12px; color: var(--muted); }
    b { color: var(--fg); font-weight: 600; word-break: break-all; }
    .code { font: 12px Consolas, monospace; color: var(--muted); margin-top: 14px; }
    .row { display: flex; gap: 10px; margin-top: 26px; flex-wrap: wrap; }
    button { font: inherit; font-size: 14px; font-weight: 600; height: 38px; padding: 0 20px; border-radius: 8px; cursor: pointer; }
    .primary { background: var(--accent); color: #fff; border: 0; }
    .ghost { background: none; border: 1px solid var(--line); color: var(--fg); }
  </style>
</head>
<body>
  <main>
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="4" width="18" height="15" rx="3"/><path d="M8.5 10l2 2M10.5 10l-2 2M13.5 10l2 2M15.5 10l-2 2M9 16c1.8-1.3 4.2-1.3 6 0"/>
    </svg>
    <h1 id="title">This page crashed</h1>
    <p id="msg"></p>
    <p id="again" hidden>It crashed again right after reloading. If it keeps happening, the site may be broken, or try closing other tabs to free up memory.</p>
    <div class="code" id="code"></div>
    <div class="row">
      <button class="primary" id="reload" autofocus>Reload</button>
      <button class="ghost" id="close">Close tab</button>
    </div>
  </main>
  <script src="crashed.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sidebar</title>
  <link rel="stylesheet" href="shared/base.css">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="grain"></div>
  <main id="app">
    <header class="top">
      <div class="nav">
        <button id="back" class="icon-btn" title="Back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button id="fwd" class="icon-btn" title="Forward" aria-label="Forward"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
        <button id="reload" class="icon-btn" title="Reload" aria-label="Reload"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg></button>
        <span class="spacer"></span>
        <button id="little" class="icon-btn" title="Little Arc (Alt+Shift+N)" aria-label="Little Arc"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="13" rx="3"/><path d="M4 10h16"/></svg></button>
      </div>
      <form id="urlForm" class="url">
        <input id="url" spellcheck="false" autocomplete="off" aria-label="Address">
      </form>
    </header>

    <section id="favorites" class="favorites" aria-label="Favorites"></section>

    <section id="view-main" class="scroll">
      <div class="space-head">
        <button id="spaceTitle" class="space-title" title="Edit Space"></button>
        <button id="editSpace" class="icon-btn small" title="Edit Space theme" aria-label="Edit Space theme"><svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/></svg></button>
      </div>
      <ul id="pinned" class="list pinned" aria-label="Pinned tabs"></ul>
      <div class="divider"><span></span></div>
      <button id="newTab" class="row new-tab"><span class="plus">+</span><span>New Tab</span></button>
      <ul id="today" class="list" aria-label="Tabs"></ul>
      <button id="tidy" class="tidy" title="Close every unpinned tab in this Space">Clear</button>
    </section>

    <section id="view-archive" class="scroll" hidden>
      <div class="space-head"><div class="space-title">Archived tabs</div>
        <button id="archiveBack" class="icon-btn small" title="Back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <p class="hint">Tabs left alone get archived automatically (change the time in Settings).</p>
      <ul id="archiveList" class="list"></ul>
      <button id="clearArchive" class="tidy">Clear archive</button>
    </section>

    <section id="view-edit" class="scroll" hidden>
      <div class="space-head"><div class="space-title">Edit Space</div>
        <button id="editDone" class="icon-btn small" title="Done" aria-label="Done"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></button></div>
      <div id="editorHost"></div>
    </section>

    <footer class="bottom">
      <button id="archiveBtn" class="icon-btn" title="Archived tabs" aria-label="Archived tabs"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11h14V8M10 12h4"/></svg></button>
      <nav id="spaces" class="spaces" aria-label="Spaces"></nav>
      <button id="addSpace" class="icon-btn" title="New Space" aria-label="New Space"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button id="settings" class="icon-btn" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </footer>
  </main>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
